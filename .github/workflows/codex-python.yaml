name: Test CodeX Python

on:
  workflow_call:
    inputs:
        team-name:
            required: true
            type: string
        pr_head_sha:
            required: true
            type: string
        machine_name:
            required: true
            type: string
    secrets:
        test-repo:
            required: true
        auth-token:
            required: true
        backend-url:
            required: true
        auth-key:
            required: true

jobs:
  test-bug-301:
    name: test-bug-301
    runs-on: ${{ inputs.machine_name }}
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: checkout tests
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.test-repo }}
          token: ${{ secrets.auth-token }}
          sparse-checkout: python
          sparse-checkout-cone-mode: false
          path: tests

      - name: Setup test files
        run: mv tests/python/* tests/

      - name: setup python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: install dependencies
        run: python -m pip install -r requirements.txt

      - name: run test on bug 301 and report status
        shell: bash {0}
        run: |
          set +e
          # Run the specific pytest test for BUG-301 using BUGXXX format
          python -m pytest -v --disable-warnings tests/test_auth_advanced.py::BUG301
          result=$?
          test_status=""
          if [ ${result} -ne 0 ]; then
              echo "Test FAILED"
              test_status="fail"
          else
              echo "Test PASSED"
              test_status="pass"
          fi
          echo "Sending status '$test_status' to backend..."
          curl -X POST ${{ secrets.backend-url }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.auth-key }}" \
            -d "{
                \"tablePrefix\": \"uni_\",
                \"teamName\": \"${{ inputs.team-name }}\",
                \"bugCode\": \"BUG-301\",
                \"status\": \"$test_status\"
            }"
          # Exit with the original test result code to reflect job status
          exit ${result}

