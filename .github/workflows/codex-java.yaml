name: Test CodeX Java

on:
  workflow_call:
    inputs:
      team-name:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string
      machine_name:
        required: true
        type: string
    secrets:
      test-repo:
        required: true
      auth-token:
        required: true
      backend-url:
        required: true
      auth-key:
        required: true

jobs:
  test-project:
    runs-on: ${{ inputs.machine_name }}
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: checkout tests
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.test-repo }}
          token: ${{ secrets.auth-token }}
          sparse-checkout: java
          sparse-checkout-cone-mode: false
          path: tests

      - name: setup test files
        run: |
          mkdir -p src/test/java/com/codejam/codex/authzen
          mv tests/* src/test/java/com/codejam/codex/authzen/

      - name: setup java
        uses: actions/setup-java@v2
        with:
          distribution: 'microsoft'
          java-version: 17

      - name: setup maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: run test on bug 01
        run: mvn -Dtest=JwtServiceTest#BUG002 test
        continue-on-error: true

      - name: run test on bug 02
        run: mvn -Dtest=JwtServiceTest#BUG003 test
        continue-on-error: true

      - name: run test on bug 03
