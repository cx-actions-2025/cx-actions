name: Test CodeX Go Project (mini-etcd)

on:
  workflow_call:
    inputs:
      team-name:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string
      machine_name:
        required: true
        type: string
    secrets:
      backend-url:
        required: true
      auth-key:
        required: true


x-test-steps: &test-steps
  - name: Checkout PR code
    uses: actions/checkout@v3
    with:
      ref: ${{ inputs.pr_head_sha }}
      path: pr-code

  - name: Checkout Main-branch tests
    uses: actions/checkout@v3
    with:
      ref: main
      path: main-tests
      sparse-checkout: |
        tests
        go.mod
        go.sum
      sparse-checkout-cone-mode: false

  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: '1.22'

  - name: Copy public tests into PR workspace
    working-directory: pr-code
    run: |
      mkdir -p tests
      cp -r ../main-tests/tests/* ./tests/

  - name: Download Go modules
    working-directory: pr-code
    run: go mod tidy

  # ------------------------------------------------------------
  #  The test itself – the two env vars are filled per-job.
  # ------------------------------------------------------------
  - name: Run ${{ env.TEST_NAME }} and report
    working-directory: pr-code
    env:
      TEST_NAME: ${{ env.TEST_NAME }}
      BUG_CODE : ${{ env.BUG_CODE }}
      BACKEND  : ${{ secrets.backend-url }}
      AUTH_KEY : ${{ secrets.auth-key }}
      TEAM     : ${{ inputs.team-name }}
    run: |
      set +e
      go test ./tests -v -run "^${TEST_NAME}$" > test_output.log 2>&1
      rc=$?

      status="pass"
      if [ $rc -ne 0 ]; then
        status="fail"
        echo "Test FAILED – see log:"
        cat test_output.log
      else
        echo "Test PASSED"
      fi

      echo "Reporting $status for $BUG_CODE"
      curl -sf -X POST "${BACKEND}" \
        -H "Content-Type: application/json" \
        -H "x-webhook-token: ${AUTH_KEY}" \
        -d '{
              "tablePrefix": "uni_",
              "teamName"   : "'"${TEAM}"'",
              "bugCode"    : "'"${BUG_CODE}"'",
              "status"     : "'"${status}"'"
            }' \
        || echo "::warning::Could not report status"

      exit $rc

# ---------------------------------------------------------------------------
#                       Individual test jobs (11)
# ---------------------------------------------------------------------------

jobs:

  test-EndToEndReplication:
    name: Test EndToEndReplication
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestEndToEndReplication
      BUG_CODE : TestEndToEndReplication
    steps: *test-steps

  test-ConcurrentWrites:
    name: Test ConcurrentWrites
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestConcurrentWrites
      BUG_CODE : TestConcurrentWrites
    steps: *test-steps

  test-LeaderFailover:
    name: Test LeaderFailover
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestLeaderFailover
      BUG_CODE : TestLeaderFailover
    steps: *test-steps

  test-FollowerCatchUp:
    name: Test FollowerCatchUp
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestFollowerCatchUp
      BUG_CODE : TestFollowerCatchUp
    steps: *test-steps

  test-LeaderRestartWithDisk:
    name: Test LeaderRestartWithDisk
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestLeaderRestartWithDisk
      BUG_CODE : TestLeaderRestartWithDisk
    steps: *test-steps

  test-StoreBasicOps:
    name: Test StoreBasicOps
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestStoreBasicOps
      BUG_CODE : TestStoreBasicOps
    steps: *test-steps

  test-StoreLRUEviction:
    name: Test StoreLRUEviction
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestStoreLRUEviction
      BUG_CODE : TestStoreLRUEviction
    steps: *test-steps

  test-StorePersistence:
    name: Test StorePersistence
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestStorePersistence
      BUG_CODE : TestStorePersistence
    steps: *test-steps

  test-StoreConcurrent:
    name: Test StoreConcurrent
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestStoreConcurrent
      BUG_CODE : TestStoreConcurrent
    steps: *test-steps

  test-BoltLogTruncateBefore:
    name: Test BoltLogTruncateBefore
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestBoltLogTruncateBefore
      BUG_CODE : TestBoltLogTruncateBefore
    steps: *test-steps

  test-ClusterManualPrune:
    name: Test ClusterManualPrune
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestClusterManualPrune
      BUG_CODE : TestClusterManualPrune
    steps: *test-steps

  test-ClusterAutoPrune:
    name: Test ClusterAutoPrune
    runs-on: ${{ inputs.machine_name }}
    env:
      TEST_NAME: TestClusterAutoPrune
      BUG_CODE : TestClusterAutoPrune
