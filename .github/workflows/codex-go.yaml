name: Test CodeX Go Project

on:
  workflow_call:
    inputs:
      team-name:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string
      machine_name:
        required: true
        type: string
    secrets:
      backend-url:
        required: true
      auth-key:
        required: true

jobs:
  # --- Test BUG-501 ---
  test_BUG_501_EndToEndReplication:
    name: Test BUG-501 (EndToEndReplication)
    runs-on: ${{ inputs.machine_name }}
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.pr_head_sha }}
          path: pr-code
      - name: Checkout Main Branch Tests
        uses: actions/checkout@v3
        with:
          ref: main
          path: main-branch-code
          sparse-checkout: |
            tests
            go.mod
            go.sum
          sparse-checkout-cone-mode: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Prepare Test Environment
        working-directory: pr-code
        run: |
          mkdir -p tests
          cp -r ../main-branch-code/tests/* ./tests/
      - name: Download Go Modules
        working-directory: pr-code
        run: go mod tidy
      - name: Run Test and Report Status
        working-directory: pr-code
        run: |
          set +e
          go test ./tests -v -run '^TestEndToEndReplication$' > test_output.log 2>&1
          result=$?
          test_status="fail"
          bug_code="BUG-501"
          if [ ${result} -ne 0 ]; then
              echo "Test FAILED: TestEndToEndReplication"
              cat test_output.log
          else
              echo "Test PASSED: TestEndToEndReplication"
              test_status="pass"
          fi
          echo "Sending status '$test_status' for bug '$bug_code' to backend..."
          curl -sf -X POST ${{ secrets.backend-url }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.auth-key }}" \
            -d "{
                \"tablePrefix\": \"uni_\",
                \"teamName\": \"${{ inputs.team-name }}\",
                \"bugCode\": \"$bug_code\",
                \"status\": \"$test_status\"
            }"
          exit ${result}

