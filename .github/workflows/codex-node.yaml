name: Test Nest Project
on:
  workflow_call:
    inputs:
        team-name:
            required: true
            type: string
        pr_head_sha:
            required: true
            type: string
        machine_name:
            required: true
            type: string
    secrets:
        test-repo:
            required: true
        auth-token:
            required: true
        backend-url:
            required: true
        auth-key:
            required: true
        image-url:
            required: true

jobs:
  test-bug-01:
    runs-on: ${{ inputs.machine_name }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: checkout tests
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.test-repo }}
          token: ${{ secrets.auth-token }}
          sparse-checkout: node
          sparse-checkout-cone-mode: false
          path: test

      - name: Setup test files
        run: |
            mkdir -p apps/cse40/expected_images
            mv test/node/expected_images/* apps/cse40/expected_images/
            mv test/node/* test/

      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          npm install
          npm install concurrently
          python -m pip install --upgrade pip
          pip install pillow numpy httpx

      - name: Download input image
        run: |
          mkdir -p apps/cse40/images
          wget -O apps/cse40/images/input_image.png "${{ secrets.image-url }}"

      - name: Start Services and Make API Call
        run: |
          npx concurrently "npm run start" "npm run start:basic-processing" &
          echo "Waiting for services to start..."
          for i in {1..30}; do
            nc -z localhost 3000 && nc -z localhost 4001 && break
            echo "Waiting for ports 3000, 4001..."
            sleep 1
          done

          curl --fail -X POST http://localhost:3000/basic-processing/resize \
            -H "Content-Type: application/json" \
            -d '{"imagePath": "apps/cse40/images/input_image.png", "width": 800, "height": 600}' || exit 1

      - name: Run Test 01
        run: |
            python test/single_tests/test_resized_image.py 
            result=$?
            if [ ${result} -ne 0 ]; then echo "FAILED"; curl -X POST ${{ secrets.backend-url }} -H "Content-Type: application/json" -H "x-webhook-token: ${{ secrets.auth-key }}" -d '{"teamName": "${{ inputs.team-name }}", "bugCode": "BUG-201", "tablePrefix":"uni_", "status":"fail"}'; else echo "PASSED"; curl -X POST ${{ secrets.backend-url }} -H "Content-Type: application/json" -H "x-webhook-token: ${{ secrets.auth-key }}" -d '{"teamName": "${{ inputs.team-name }}", "bugCode": "BUG-201", "tablePrefix":"uni_", "status":"pass"}'; fi
            exit ${result}


