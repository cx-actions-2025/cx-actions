          wget -O apps/cse40/images/input_image.png "https://firebasestorage.googleapis.com/v0/b/profile-image-1c78a.appspot.com/o/codejam%2Finput_image.png?alt=media&token=${{ secrets.firebase-token }}"

      - name: Start Services and Run Harris Corner Detection API
        run: |
          npx concurrently "npm run start" "npm run start:feature-detection" &
          echo "Waiting for services to start..."
          for i in {1..30}; do
            nc -z localhost 3000 && nc -z localhost 4003 && break
            echo "Waiting for ports 3000, 4003..."
            sleep 1
          done

          curl --fail -X POST http://localhost:3000/feature-detection/harris-corner-detection \
            -H "Content-Type: application/json" \
            -d '{"imagePath": "apps/cse40/images/input_image.png", "k": 0.04, "windowSize": "3", "thresh": 0.00001}' || exit 1

      - name: Run Test 11
        run: |
            python test/single_tests/test_harris_corners.py > /dev/null 2>&1
            result=$?
            if [ ${result} -ne 0 ]; then echo "FAILED"; else echo "PASSED"; curl -X POST ${{ secrets.backend-url }} -H "Content-Type: application/json" -H "x-webhook-token: ${{ secrets.auth-key }}" -d '{"teamName": "${{ inputs.team-name }}","bugCode": "BUG-211"}'; fi
            exit ${result}